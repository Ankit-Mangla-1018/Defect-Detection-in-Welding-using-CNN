model:
  name: WeldCNN
  num_classes: 4
  dropout: 0.5

data:
  raw_dir: data/raw
  processed_dir: data/processed
  image_size: 64
  batch_size: 32
  num_workers: 4
  val_split: 0.15
  test_split: 0.15
  seed: 42

training:
  epochs: 50
  learning_rate: 0.0008
  weight_decay: 0.0002
  scheduler: cosine
  grad_clip: 1.0
  early_stopping_patience: 10
  checkpoint_dir: checkpoints
  log_dir: runs

augmentation:
  horizontal_flip: true
  vertical_flip: true
  rotation_degrees: 25
  color_jitter: true
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std:  [0.229, 0.224, 0.225]
