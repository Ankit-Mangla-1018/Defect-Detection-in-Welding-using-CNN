model:
  name: ResNet18
  num_classes: 4
  feature_extract: false   # true = head only; false = full fine-tune
  dropout: 0.4

data:
  raw_dir: data/raw
  processed_dir: data/processed
  image_size: 224          # ResNet18 expects 224×224
  batch_size: 32
  num_workers: 4
  val_split: 0.15
  test_split: 0.15
  seed: 42

training:
  epochs: 20               # fewer epochs needed — pretrained weights converge fast
  learning_rate: 0.0003    # lower LR for fine-tuning
  weight_decay: 0.0001
  scheduler: cosine
  grad_clip: 1.0
  early_stopping_patience: 5
  checkpoint_dir: checkpoints/resnet18
  log_dir: runs/resnet18

augmentation:
  horizontal_flip: true
  vertical_flip: false
  rotation_degrees: 15
  color_jitter: true
  normalize_mean: [0.485, 0.456, 0.406]  # ImageNet stats — required for pretrained weights
  normalize_std:  [0.229, 0.224, 0.225]
