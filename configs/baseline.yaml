model:
  name: WeldCNN
  num_classes: 4          # good, crack, porosity, spatters
  dropout: 0.4

data:
  raw_dir: data/raw
  processed_dir: data/processed
  image_size: 64           # matches training run; increase to 128/224 with more data
  batch_size: 32
  num_workers: 4
  val_split: 0.15
  test_split: 0.15
  seed: 42

training:
  epochs: 40
  learning_rate: 0.001
  weight_decay: 0.0001
  scheduler: cosine
  grad_clip: 1.0           # gradient clipping max norm
  early_stopping_patience: 8
  checkpoint_dir: checkpoints
  log_dir: runs

augmentation:
  horizontal_flip: true
  vertical_flip: false
  rotation_degrees: 15
  color_jitter: true
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std:  [0.229, 0.224, 0.225]
